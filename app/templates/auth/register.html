
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 40px 15px;
        }

        .container {
            max-width: 420px;
            margin: 30px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #253858;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .message {
            background-color: #eef2ff;
            padding: 10px;
            margin-bottom: 12px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Student Registration</h1>

        {% for message in get_flashed_messages() %}
            <p class="message" role="alert">
                {{ message }}
            </p>
        {% endfor %}

        <form method="POST">

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <label for="username">Username</label>
            <input
                id="username"
                type="text"
                name="username"
                minlength="3"
                maxlength="80"
                required
            >

            <label for="email">Email Address</label>
            <input
                id="email"
                type="email"
                name="email"
                maxlength="120"
                required
            >

            <label for="password">Password</label>
            <input
                id="password"
                type="password"
                name="password"
                minlength="8"
                required
            >

            <label for="confirm_password">
                Confirm Password
            </label>
            <input
                id="confirm_password"
                type="password"
                name="confirm_password"
                minlength="8"
                required
            >

            <button type="submit">
                Register
            </button>

        </form>

        <div class="links">

            <p>
                Already have an account?
                <a href="{{ url_for('auth.login') }}">
                    Login
                </a>
            </p>

            <p>
                <a href="{{ url_for('index') }}">
                    Back to Home
                </a>
            </p>

        </div>

    </main>

</body>
</html>
